spring.application.name=job-tracker-backend

# ---------- Database ----------
# Values come from environment variables so no password is stored in code.
# Set DB_PASSWORD in IntelliJ: Run > Edit Configurations > Environment variables
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/MydataBase}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# ---------- JPA ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}

# ---------- Web ----------
server.port=${PORT:8080}

# Only needed if the frontend is opened from a different server (Live Server, IntelliJ preview).
# The built-in frontend at http://localhost:8080 does not need this.
app.cors.allowed-origins=${CORS_ORIGINS:http://127.0.0.1:5500,http://localhost:5500,http://localhost:63342}

# ---------- Login (JWT) ----------
# Secret used to sign login tokens. Must be at least 32 characters.
# The default is only for local development: set JWT_SECRET to your own long random value
# before deploying, otherwise anyone who reads this file could create valid tokens.
app.jwt.secret=${JWT_SECRET:local-dev-secret-change-me-before-deploying-0123456789}
# How long a login lasts (minutes). 1440 = 24 hours.
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}
